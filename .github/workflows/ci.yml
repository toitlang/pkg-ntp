name: CI
on:
  push:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toit-version: [oldest, latest]
    steps:
      - uses: actions/checkout@v7
      - name: Resolve Toit version
        id: toit-version
        shell: bash
        run: |
          if [[ "${{ matrix.toit-version }}" == "oldest" ]]; then
            sdk=$(grep -E '^[[:space:]]+sdk:' package.yaml | head -1 \
              | sed -E 's/^[[:space:]]+sdk:[[:space:]]*//; s/^\^//' \
              | tr -d "\"' ")
            echo "version=v$sdk" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: toitlang/action-setup@v1
        with:
          toit-version: ${{ steps.toit-version.outputs.version }}
      # The tests only depend on the local package, using the checked-in lock file.
      - name: Test with a local UDP server
        shell: bash
        run: |
          # Alpha.144's "toit run" wrapper fails before invoking the compiler.
          if command -v toit.run >/dev/null 2>&1; then
            toit.run tests/synchronize-test.toit
          else
            toit run tests/synchronize-test.toit
          fi
      - name: Analyze library and examples
        shell: bash
        run: |
          for source in src/*.toit examples/*.toit; do
            if command -v toit.run >/dev/null 2>&1; then
              toit.run --analyze "$source"
            else
              toit analyze "$source"
            fi
          done
